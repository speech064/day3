<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>제주 스팟 맵</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root { --bg:#0f172a; --card:#1e293b; --line:#334155; --txt:#e2e8f0; --sub:#94a3b8; --pri:#38bdf8; --acc:#f472b6; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,"Malgun Gothic",sans-serif; background:var(--bg); color:var(--txt); }
  header { padding:20px 16px; background:linear-gradient(120deg,#0ea5e9,#8b5cf6 60%,#ec4899); }
  header h1 { margin:0; font-size:22px; }
  header p { margin:4px 0 0; opacity:.9; font-size:14px; }
  main { max-width:1100px; margin:0 auto; padding:16px; display:grid; gap:16px; }
  .tabs { display:flex; gap:8px; }
  .tab { flex:1; padding:10px; border:1px solid var(--line); background:var(--card); color:var(--sub); border-radius:10px; cursor:pointer; font-size:15px; }
  .tab.on { color:#fff; border-color:var(--pri); background:#0c4a6e; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; }
  .row { display:flex; flex-wrap:wrap; gap:10px; align-items:end; }
  label { font-size:13px; color:var(--sub); display:grid; gap:4px; }
  select, textarea, button.go { font:inherit; padding:9px 12px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--txt); }
  button.go { background:var(--pri); color:#06283d; font-weight:700; cursor:pointer; border:0; }
  button.go:disabled { opacity:.5; cursor:wait; }
  textarea { width:100%; min-height:64px; resize:vertical; }
  #map { height:420px; border-radius:12px; border:1px solid var(--line); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:10px; margin-top:12px; }
  .spot { background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  .spot b { display:block; margin-bottom:4px; }
  .tag { display:inline-block; font-size:12px; padding:2px 8px; border-radius:99px; margin-right:4px; }
  .in { background:#4c1d95; color:#ddd6fe; } .out { background:#064e3b; color:#a7f3d0; } .ar { background:#334155; color:#cbd5e1; }
  .desc { font-size:13px; color:var(--sub); margin-top:6px; }
  .note { font-size:12px; color:var(--sub); margin-top:8px; }
  .hidden { display:none; }
  .step { font-size:13px; padding:6px 10px; border-left:3px solid var(--acc); background:var(--bg); margin:6px 0; border-radius:4px; }
  .answer { white-space:pre-wrap; line-height:1.6; margin-top:10px; }
  .weather { display:flex; flex-wrap:wrap; gap:12px; margin-top:10px; padding:10px 12px; border-radius:10px; background:linear-gradient(120deg,#075985,#6d28d9); font-size:14px; }
  .err { color:#fca5a5; }
</style>
</head>
<body>
<header>
  <h1>🌋 제주 스팟 맵</h1>
  <p>제주 관광지 목록 기반 · 날씨는 Open-Meteo (API 키 없음)</p>
</header>
<main>
  <div class="tabs">
    <button class="tab on" data-t="search">🔎 직접 검색</button>
    <button class="tab" data-t="agent">🤖 AI 추천</button>
  </div>

  <section id="search" class="panel">
    <div class="row">
      <label>지역
        <select id="area">
          <option>제주시</option><option>서귀포</option><option>동쪽</option><option>서쪽</option>
        </select>
      </label>
      <label>실내/야외
        <select id="indoor">
          <option value="">전체</option><option value="true">실내</option><option value="false">야외</option>
        </select>
      </label>
      <button class="go" id="go">find_spots 검색</button>
    </div>
  </section>

  <section id="agent" class="panel hidden">
    <label>어떤 여행을 원하세요?
      <textarea id="msg" placeholder="예: 오늘 서귀포에서 아이랑 갈 만한 곳 추천해줘"></textarea>
    </label>
    <div class="row" style="margin-top:10px"><button class="go" id="ask">AI에게 추천받기</button></div>
    <div id="weather"></div>
    <div id="steps"></div>
    <div id="answer" class="answer"></div>
  </section>

  <div id="map"></div>
  <section class="panel">
    <div id="status" class="note">조건을 고르고 검색하세요.</div>
    <div id="list" class="grid"></div>
    <div class="note">목록에 있는 장소만 보여줍니다. 좌표가 없어 마커는 해당 세부 지역 중심에 표시됩니다. 방문 전 운영 정보는 공식 안내로 확인하세요.</div>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const CENTERS = {
  '동쪽(성산)': [33.4580, 126.9425], '동쪽(구좌)': [33.5560, 126.8600],
  '제주시': [33.4996, 126.5312],
  '서쪽(한림)': [33.4140, 126.2650], '서쪽(안덕)': [33.2600, 126.3200],
  '서귀포': [33.2541, 126.5601],
};
const map = L.map('map').setView([33.38, 126.55], 10);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 18, attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);
let layer = L.layerGroup().addTo(map);
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function showSpots(spots) {
  layer.clearLayers();
  $('list').innerHTML = spots.map((s) => `
    <div class="spot"><b>${esc(s.name)}</b>
      <span class="tag ar">${esc(s.area)}</span>
      <span class="tag ${s.indoor ? 'in' : 'out'}">${s.indoor ? '실내' : '야외'}</span>
      <div class="desc">${esc(s.description)}</div></div>`).join('');
  const byArea = {};
  spots.forEach((s) => (byArea[s.area] = byArea[s.area] || []).push(s));
  const pts = [];
  for (const [a, items] of Object.entries(byArea)) {
    const c = CENTERS[a];
    if (!c) continue;
    pts.push(c);
    L.marker(c).addTo(layer).bindPopup(`<b>${esc(a)}</b><br>` + items.map((s) => esc(s.name)).join('<br>'));
  }
  if (pts.length) map.fitBounds(pts, { padding: [50, 50], maxZoom: 11 });
}

async function search() {
  $('go').disabled = true;
  $('status').textContent = '검색 중…';
  const p = new URLSearchParams({ tool: 'find_spots', area: $('area').value });
  if ($('indoor').value) p.set('indoor', $('indoor').value);
  try {
    const r = await fetch('/api/tool?' + p);
    const j = await r.json();
    if (j.error) throw new Error(j.error);
    $('status').textContent = j.spots.length ? `조건에 맞는 ${j.total_matched}곳 중 ${j.spots.length}곳` : '조건에 맞는 장소가 목록에 없습니다.';
    showSpots(j.spots);
  } catch (e) {
    $('status').innerHTML = `<span class="err">오류: ${esc(e.message)}</span>`;
  }
  $('go').disabled = false;
}
$('go').onclick = search;

async function ask() {
  const message = $('msg').value.trim();
  if (!message) return;
  $('ask').disabled = true;
  $('weather').innerHTML = $('steps').innerHTML = '';
  $('answer').textContent = '에이전트가 도구를 고르는 중…';
  try {
    const r = await fetch('/api/agent', {
      method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ message })
    });
    const j = await r.json();
    if (j.error) throw new Error(j.error);
    $('steps').innerHTML = j.steps.map((s, i) =>
      `<div class="step">${i + 1}. <b>${esc(s.tool)}</b> ${esc(JSON.stringify(s.input))}</div>`).join('');
    if (j.weather) {
      const w = j.weather, t = w.today;
      $('weather').innerHTML = `<div class="weather"><span>🌤 ${esc(w.area)} ${esc(w.condition)} ${w.temperature_c}°C</span>
        <span>🌡 ${t.min_c}~${t.max_c}°C</span><span>☔ ${t.rain_probability_pct}%</span><span>🕶 UV ${t.uv_index_max}</span>
        <span>🌅 ${esc(t.sunrise.slice(11))} / 🌇 ${esc(t.sunset.slice(11))}</span></div>`;
    }
    $('answer').textContent = j.answer;
    if (j.spots.length) { showSpots(j.spots); $('status').textContent = `에이전트가 찾은 ${j.spots.length}곳`; }
  } catch (e) {
    $('answer').innerHTML = `<span class="err">오류: ${esc(e.message)}</span>`;
  }
  $('ask').disabled = false;
}
$('ask').onclick = ask;

document.querySelectorAll('.tab').forEach((b) => b.onclick = () => {
  document.querySelectorAll('.tab').forEach((x) => x.classList.toggle('on', x === b));
  $('search').classList.toggle('hidden', b.dataset.t !== 'search');
  $('agent').classList.toggle('hidden', b.dataset.t !== 'agent');
});
</script>
</body>
</html>
